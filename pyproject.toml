[project]
name = "projnewsclipping"
version = "1.0"
description = "뉴스 기사를 취합해 후보를 고르고 이메일 양식으로 만들어 주는 로컬 웹 앱"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "feedparser>=6.0",
  "selectolax>=0.3",
  "trafilatura>=1.12",
  "pyyaml>=6.0",
  "platformdirs>=4.2",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", {include-group = "legacy"}]
# 기존 Streamlit 앱(app.py, views/) 실행·테스트용. v1 앱과 설치 파일에는 포함되지 않는다.
legacy = ["streamlit>=1.40"]
build = ["pyinstaller>=6.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/newsclip"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "v1"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "v1", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
