[project]
name = "projnewsclipping"
version = "0.1.0"
description = "뉴스 기사를 취합해 후보를 고르고 이메일 양식으로 만들어 주는 Streamlit 앱"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "streamlit>=1.40",
  "httpx>=0.27",
  "feedparser>=6.0",
  "selectolax>=0.3",
  "trafilatura>=1.12",
  "pyyaml>=6.0",
  "platformdirs>=4.2",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/newsclip"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
