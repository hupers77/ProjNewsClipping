name: build

# Windows 설치 파일 빌드 (PyInstaller + Inno Setup). 크로스 빌드가 안 되므로 Windows 러너에서 한다.
# 릴리스(v* 태그 푸시)와 수동 실행에서만 동작한다 — PR·일반 push 에서는 빌드하지 않는다.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv sync --group build --group dev
      - name: 테스트
        run: uv run pytest -q
      - name: 빌드 정보 기록
        run: uv run python packaging/write_build_info.py
      - name: PyInstaller 빌드
        run: uv run pyinstaller packaging/newsclipping.spec --noconfirm
      - name: 산출물 점검 (모든 화면 스크립트 실행)
        run: dist/NewsClipping/NewsClipping.exe --smoke
        shell: bash
      - name: Inno Setup 준비
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
          # 한국어 설치 화면 (비공식 번역). 받지 못하면 영어 화면으로 진행한다.
          try {
            Invoke-WebRequest "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/Unofficial/Korean.isl" -OutFile packaging/Korean.isl
          } catch { Write-Host "Korean.isl 다운로드 실패 - 영어 화면으로 진행" }
      - name: 설치 파일 생성
        shell: pwsh
        run: |
          $ver = (uv run python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])").Trim()
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = (Get-Command iscc).Source }
          & $iscc "/DAppVersion=$ver" packaging/installer.iss
          if ($LASTEXITCODE -ne 0) { throw "iscc 실패" }
      - uses: actions/upload-artifact@v4
        with:
          name: NewsClipping-Windows-Setup
          path: dist/NewsClipping-Setup-*.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: 릴리스 생성
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}" artifacts/*.exe
          --repo "${{ github.repository }}" --title "${{ github.ref_name }}" --generate-notes
